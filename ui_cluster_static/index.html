<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sail vs Spark — Cluster Benchmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg:       #0d0d0f;
  --surface:  #17171a;
  --border:   #2a2a30;
  --fg:       #e8e8f0;
  --muted:    #7a7a8c;
  --sail:     #00d4aa;
  --spark:    #ff6b6b;
  --accent:   #5b8fff;
  --good:     #00d4aa;
  --warn:     #ffc94d;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 14px;
  min-height: 100vh;
}

/* ── Layout ── */
.shell { display: flex; height: 100vh; overflow: hidden; }
.sidebar {
  width: 220px; min-width: 220px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.main { flex: 1; overflow-y: auto; padding: 28px 32px; }

/* ── Sidebar ── */
.sidebar-header {
  padding: 18px 16px 12px;
  font-size: 11px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.result-item {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
}
.result-item:hover { background: rgba(255,255,255,.04); }
.result-item.active { background: rgba(0,212,170,.08); border-left: 2px solid var(--sail); }
.result-item .ri-name { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--fg); }
.result-item .ri-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.no-results { padding: 16px; color: var(--muted); font-size: 12px; }

/* ── Header ── */
.page-header { margin-bottom: 28px; }
.page-header h1 {
  font-size: 22px; font-weight: 600; letter-spacing: -.01em;
  color: var(--fg); margin-bottom: 4px;
}
.page-header .subtitle { font-size: 13px; color: var(--muted); }
.badge {
  display: inline-block;
  padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 600; letter-spacing: .04em;
  margin-right: 6px;
}
.badge-sail  { background: rgba(0,212,170,.15); color: var(--sail); }
.badge-spark { background: rgba(255,107,107,.15); color: var(--spark); }

/* ── Summary table ── */
.summary-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 32px;
}
.card-title {
  padding: 14px 20px;
  font-size: 12px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--border);
}
table { width: 100%; border-collapse: collapse; }
thead th {
  padding: 10px 20px;
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted);
  text-align: right; border-bottom: 1px solid var(--border);
}
thead th:first-child { text-align: left; }
tbody tr { border-bottom: 1px solid rgba(255,255,255,.04); }
tbody tr:last-child { border-bottom: none; }
tbody td {
  padding: 11px 20px;
  font-family: 'IBM Plex Mono', monospace; font-size: 13px;
  text-align: right;
}
tbody td:first-child {
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 500; color: var(--fg); text-align: left;
}
.sail-val  { color: var(--sail); }
.spark-val { color: var(--spark); }
.speedup-faster { color: var(--good); font-weight: 600; }
.speedup-slower { color: var(--warn); }

/* ── Charts ── */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 32px;
}
@media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
.chart-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 20px;
}
.chart-card h3 {
  font-size: 12px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 14px;
}
.chart-wrap { position: relative; height: 200px; }

/* ── Runs scatter ── */
.runs-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 32px;
  overflow: hidden;
}
.runs-wrap { position: relative; height: 260px; padding: 16px 20px; }

/* ── Legend ── */
.legend { display: flex; gap: 20px; margin-bottom: 20px; align-items: center; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.legend-item { font-size: 12px; color: var(--muted); display: flex; align-items: center; }

/* ── Loading / error ── */
.placeholder {
  display: flex; align-items: center; justify-content: center;
  height: 300px; color: var(--muted); font-size: 14px;
}
</style>
</head>
<body>
<div class="shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">Result Files</div>
    <div id="resultList"><div class="no-results">Loading…</div></div>
  </aside>

  <!-- Main -->
  <main class="main" id="main">
    <div class="placeholder">Select a result file from the sidebar</div>
  </main>

</div>

<script>
const QUERY_LABELS = {
  full_agg:     "Full Scan — Multi-col SUM",
  grouped_agg:  "Group By — Entity & Scenario",
  filtered_agg: "Filtered Agg — Partition Range",
  join_entity:  "JOIN — Entity Hierarchy",
  join_desk:    "JOIN — Trading Desk",
  join_calendar:"JOIN — Fiscal Quarter",
};
const QUERY_ORDER = Object.keys(QUERY_LABELS);

let currentCharts = [];

function destroyCharts() {
  currentCharts.forEach(c => { try { c.destroy(); } catch(e){} });
  currentCharts = [];
}

// ── Sidebar ──────────────────────────────────────────────────────────────────
async function loadList() {
  try {
    const r = await fetch("/api/results/list");
    const files = await r.json();
    const el = document.getElementById("resultList");
    if (!files.length) {
      el.innerHTML = '<div class="no-results">No results yet.<br>Run bench_cluster.py first.</div>';
      return;
    }
    el.innerHTML = files.map((f, i) =>
      `<div class="result-item${i===0?' active':''}" onclick="loadResult('${f.filename}', this)">
        <div class="ri-name">${f.filename.replace('results_','').replace('.json','')}</div>
        <div class="ri-meta">${f.engines.join(' + ') || '—'}</div>
      </div>`
    ).join('');
    if (files.length) loadResult(files[0].filename, el.querySelector('.result-item'));
  } catch(e) {
    document.getElementById("resultList").innerHTML =
      '<div class="no-results">Error loading files</div>';
  }
}

function loadResult(filename, el) {
  document.querySelectorAll('.result-item').forEach(x => x.classList.remove('active'));
  if (el) el.classList.add('active');
  fetch(`/api/results/${filename}`)
    .then(r => r.json())
    .then(renderResults)
    .catch(e => {
      document.getElementById('main').innerHTML =
        `<div class="placeholder">Error: ${e.message}</div>`;
    });
}

// ── Render ───────────────────────────────────────────────────────────────────
function renderResults(data) {
  destroyCharts();
  const hasSail  = !!data.sail;
  const hasSpark = !!data.spark;
  const ts       = data._timestamp || data._filename || '';
  const filename = data._filename  || '';

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-header">
      <h1>Sail vs Spark — Local Cluster Benchmark</h1>
      <div class="subtitle">
        <span class="badge badge-sail">Sail local-cluster (3 workers)</span>
        <span class="badge badge-spark">Spark local-cluster[3,1,1024]</span>
        ${ts ? `&nbsp;&nbsp;${ts}` : ''}
        &nbsp;&nbsp;<span style="color:var(--muted);font-size:11px">${filename}</span>
      </div>
    </div>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:var(--sail)"></span>Sail</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--spark)"></span>Spark</span>
      <span style="font-size:11px;color:var(--muted)">54.88M rows · 9.71 GB · 6 FRTB queries · 10 runs each</span>
    </div>
    ${buildSummaryTable(data)}
    <div class="charts-grid" id="chartsGrid"></div>
    ${buildRunsCard(data)}
  `;

  buildBarCharts(data);
}

function buildSummaryTable(data) {
  const rows = QUERY_ORDER.map(qid => {
    const s = data.sail?.[qid];
    const k = data.spark?.[qid];
    const sailP99  = s?.p99_ms ?? null;
    const sparkP99 = k?.p99_ms ?? null;
    const speedup  = (sailP99 && sparkP99) ? (sparkP99 / sailP99).toFixed(2) : null;
    const winner   = speedup ? (parseFloat(speedup) >= 1 ? 'Sail' : 'Spark') : '';

    const sailCell  = sailP99  != null ? `<span class="sail-val">${sailP99.toLocaleString()} ms</span>` : '<span class="muted">—</span>';
    const sparkCell = sparkP99 != null ? `<span class="spark-val">${sparkP99.toLocaleString()} ms</span>` : '<span class="muted">—</span>';
    const speedCell = speedup  != null
      ? `<span class="${parseFloat(speedup)>=1?'speedup-faster':'speedup-slower'}">${speedup}×${winner==='Sail'?' Sail faster':' Spark faster'}</span>`
      : '—';

    return `<tr>
      <td>${QUERY_LABELS[qid] || qid}</td>
      <td>${sailCell}</td>
      <td>${sparkCell}</td>
      <td>${speedCell}</td>
    </tr>`;
  }).join('');

  return `<div class="summary-card">
    <div class="card-title">P99 Latency Summary</div>
    <table>
      <thead><tr>
        <th>Query</th><th>Sail P99</th><th>Spark P99</th><th>Speedup</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function buildBarCharts(data) {
  const grid = document.getElementById('chartsGrid');
  QUERY_ORDER.forEach(qid => {
    const s = data.sail?.[qid];
    const k = data.spark?.[qid];
    if (!s && !k) return;

    const card = document.createElement('div');
    card.className = 'chart-card';
    card.innerHTML = `<h3>${QUERY_LABELS[qid]||qid}</h3><div class="chart-wrap"><canvas id="bar_${qid}"></canvas></div>`;
    grid.appendChild(card);

    const labels = [], vals = [], colors = [];
    if (s) { labels.push('Sail'); vals.push(s.median_ms); colors.push('rgba(0,212,170,0.8)'); }
    if (k) { labels.push('Spark'); vals.push(k.median_ms); colors.push('rgba(255,107,107,0.8)'); }

    const ctx = document.getElementById(`bar_${qid}`).getContext('2d');
    const chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data: vals,
          backgroundColor: colors,
          borderRadius: 4,
          borderSkipped: false,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#7a7a8c', font: { family: "'IBM Plex Sans'" } },
               grid: { color: 'rgba(255,255,255,.04)' } },
          y: { ticks: { color: '#7a7a8c', callback: v => `${v.toLocaleString()}ms` },
               grid: { color: 'rgba(255,255,255,.06)' } }
        }
      }
    });
    currentCharts.push(chart);
  });
}

function buildRunsCard(data) {
  const allTimes = {};
  QUERY_ORDER.forEach(qid => {
    const s = data.sail?.[qid]?.times_ms  || [];
    const k = data.spark?.[qid]?.times_ms || [];
    if (s.length || k.length) allTimes[qid] = { sail: s, spark: k };
  });
  if (!Object.keys(allTimes).length) return '';

  return `<div class="runs-card">
    <div class="card-title">All Run Times — 10 Runs per Query</div>
    <div class="runs-wrap"><canvas id="runsChart"></canvas></div>
  </div>`;
}

function buildRunsChart(data) {
  const ctx = document.getElementById('runsChart');
  if (!ctx) return;

  const sailDatasets = [], sparkDatasets = [];
  const labels = [];
  let x = 0;

  const sailPoints = [], sparkPoints = [];

  QUERY_ORDER.forEach(qid => {
    const s = data.sail?.[qid]?.times_ms  || [];
    const k = data.spark?.[qid]?.times_ms || [];
    const maxLen = Math.max(s.length, k.length, 1);
    for (let i = 0; i < maxLen; i++) {
      labels.push(i === 0 ? (QUERY_LABELS[qid]?.split('—')[0]?.trim() || qid) : '');
    }
    s.forEach((v, i) => sailPoints.push({ x: x + i, y: v }));
    k.forEach((v, i) => sparkPoints.push({ x: x + i, y: v }));
    x += maxLen;
  });

  const chart = new Chart(ctx, {
    type: 'scatter',
    data: {
      datasets: [
        {
          label: 'Sail',
          data: sailPoints,
          backgroundColor: 'rgba(0,212,170,0.7)',
          pointRadius: 5, pointHoverRadius: 7,
        },
        {
          label: 'Spark',
          data: sparkPoints,
          backgroundColor: 'rgba(255,107,107,0.7)',
          pointRadius: 5, pointHoverRadius: 7,
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#e8e8f0', font: { family: "'IBM Plex Sans'" } } },
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()}ms`
          }
        }
      },
      scales: {
        x: { ticks: { color: '#7a7a8c', maxTicksLimit: 6 }, grid: { color: 'rgba(255,255,255,.04)' } },
        y: { ticks: { color: '#7a7a8c', callback: v => `${v.toLocaleString()}ms` },
             grid: { color: 'rgba(255,255,255,.06)' } }
      }
    }
  });
  currentCharts.push(chart);
}

// After renderResults, charts are injected; build scatter after DOM update
const origRender = renderResults;
window.renderResults = function(data) {
  origRender(data);
  setTimeout(() => buildRunsChart(data), 50);
};

window.renderResults = function(data) {
  destroyCharts();
  const hasSail  = !!data.sail;
  const hasSpark = !!data.spark;
  const ts       = data._timestamp || '';
  const filename = data._filename  || '';

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-header">
      <h1>Sail vs Spark — Local Cluster Benchmark</h1>
      <div class="subtitle">
        <span class="badge badge-sail">Sail local-cluster (3 workers)</span>
        <span class="badge badge-spark">Spark local-cluster[3,1,1024]</span>
        ${ts ? `&nbsp;&nbsp;${ts}` : ''}
        &nbsp;&nbsp;<span style="color:var(--muted);font-size:11px">${filename}</span>
      </div>
    </div>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:var(--sail)"></span>Sail</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--spark)"></span>Spark</span>
      <span style="font-size:11px;color:var(--muted)">54.88M rows · 9.71 GB · 6 FRTB queries · 10 runs each</span>
    </div>
    ${buildSummaryTable(data)}
    <div class="charts-grid" id="chartsGrid"></div>
    ${buildRunsCard(data)}
  `;

  buildBarCharts(data);
  setTimeout(() => buildRunsChart(data), 30);
};

loadList();
</script>
</body>
</html>
